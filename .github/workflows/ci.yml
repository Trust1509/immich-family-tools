name: CI

on:
  push:
    branches: [main, "release/**"]
  # `pull_request` bewusst entfernt (Notbremse 14.08.2026):
  # Dies ist ein Trunk-Workflow ohne menschliche PRs — der Trigger bediente
  # ausschliesslich Dependabot und verdoppelte dessen Kosten (ein Lauf am PR,
  # ein zweiter am Push nach dem Merge). Belegt am 11.08.: zwei PR-Laeufe fuer
  # zwei Bot-PRs, die inhaltlich schon auf main geprueft worden waeren.
  # Kommen je menschliche PRs dazu, gehoert der Trigger zurueck.
  workflow_dispatch:

# Ein neuer Push bricht den noch laufenden Lauf desselben Zweigs ab.
# Tag-Refs bekommen eine eigene Gruppe OHNE Abbruch — ein Release-Lauf darf
# nicht von einem Folge-Push gekillt werden.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests
      - run: python -m compileall -q backend
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: immich-family-tools:ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
