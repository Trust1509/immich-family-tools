name: CI

on:
  push:
    branches: [main, "release/**"]
    # Tag-Laeufe zulassen: ohne diesen Trigger prueft CI nie einen Tag-Ref,
    # und die Regel "Tag erst nach gruener CI" waere nicht ueberpruefbar.
    tags: ["v*"]
    # Reiner Doku-Push loest keinen Lauf aus, ohne dass jemand an
    # `[skip ci]` denken muss (Dauerregel "ein CI-Lauf je Slice", siehe
    # CLAUDE.md, Abschnitt "Pruefschritte"). Praezisierungen:
    #   - GitHub wertet Pfadfilter NICHT bei Tag-Pushes aus (GitHub-Doku,
    #     "Workflow syntax for GitHub Actions": "Path filters are not
    #     evaluated for pushes of tags."). Der `tags: ["v*"]`-Trigger oben
    #     bleibt also vollstaendig wirksam — das war die Falle vom 14.08.:
    #     Tags loesten gar keine CI aus. Sie darf nicht durch die
    #     Hintertuer zurueckkommen.
    #   - `paths-ignore` greift nur, wenn ALLE geaenderten Dateien passen.
    #     Ein Commit mit Doku UND Code laeuft ganz normal. `[skip ci]`
    #     bleibt das Mittel fuer Bau-, Panel- und Nacharbeits-Commits mit
    #     Code. Nur `**.md` zaehlt als Doku hier drin: `docs/**` waere
    #     zu weit gefasst und wuerde auch Shell-Skripte unter `docs/betrieb/`
    #     verschlucken (Sicherung, Rueckspiel-Probe) — die sind Code, kein
    #     Text.
    #   - Gefilterte Pushes und der Secrets-Scan: siehe CLAUDE.md, Abschnitt
    #     Pruefschritte.
    #   - GitHub startet bei Pfadfiltern ausserdem gar keinen Lauf, wenn kein
    #     Dateiinhalt sich aendert (`--allow-empty`-Commit, neuer
    #     `release/**`-Zweig auf einem bestehenden Commit) — kein Bug, nur
    #     damit es niemanden ueberrascht.
    paths-ignore:
      - "**.md"
  # `pull_request` bewusst entfernt (dauerhaft, ehemals Notbremse 14.08.2026):
  # Dies ist ein Trunk-Workflow ohne menschliche PRs — der Trigger bediente
  # ausschliesslich Dependabot und verdoppelte dessen Kosten (ein Lauf am PR,
  # ein zweiter am Push nach dem Merge). Belegt am 11.08.: zwei PR-Laeufe fuer
  # zwei Bot-PRs, die inhaltlich schon auf main geprueft worden waeren.
  # Kommen je menschliche PRs dazu, gehoert der Trigger zurueck.
  workflow_dispatch:

# Ein neuer Push bricht den noch laufenden Lauf desselben Zweigs ab
# (dauerhaft, ehemals Notbremse 14.08.2026). Tag-Refs bekommen eine eigene
# Gruppe OHNE Abbruch — ein Release-Lauf darf nicht von einem Folge-Push
# gekillt werden.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Fremde Actions sind auf den Commit-SHA des jeweiligen Release-Tags gepinnt,
# nicht auf den beweglichen Tag selbst: ein beweglicher Tag (z. B. @v7) ist eine
# offene Tuer — der Maintainer kann ihn jederzeit auf einen anderen Commit
# umsetzen, und CI wuerde stillschweigend fremden, ungeprueften Code ausfuehren.
# Der SHA garantiert NUR Unveraenderlichkeit (welcher Code laeuft), NICHT
# Herkunft/Vertrauenswuerdigkeit (ob der Code sauber ist) — die Herkunft wurde
# beim Pinnen einmalig ueber die GitHub-API des jeweiligen Original-Repos
# geprueft (die API-URL enthaelt das Repo, das ist der Herkunftsnachweis).
#
# Jeder Job traegt timeout-minutes. Ohne Grenze laeuft ein haengender Job bis
# zum Plattform-Standard von 360 Minuten und blockiert so lange den
# Concurrency-Slot dieses Workflows sowie Runner-Zeit; in einem privaten Repo
# waere das zusaetzlich Portfolio-Budget (Regel und Zahlen: CLAUDE.md,
# Abschnitt "Pruefschritte"). Gemessene Laufzeit am 02.09.2026: 9-23 Sekunden
# je Job — die Werte unten sind grosszuegig gewaehlt, keine Messwerte.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests
      - run: python -m compileall -q backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: immich-family-tools:ci

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
