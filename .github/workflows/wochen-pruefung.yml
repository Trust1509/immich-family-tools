# Getrennt vom Push-Pfad (ci.yml), weil beide Rot-Ursachen fachlich verschieden
# sind: Ein neu veroeffentlichtes fremdes Advisory (pip-audit/npm audit) faerbt
# diesen Lauf rot, OHNE dass sich im Repo etwas geaendert hat. Liefe das auf dem
# Push-Pfad, wuerde ein fremdes Advisory eine Auslieferung blockieren, die damit
# nichts zu tun hat — und das erzieht dazu, rote Laeufe wegzuklicken statt sie
# ernst zu nehmen.
# Beleg aus diesem Repo: Commit 096db40 — ein nanoid-Advisory faerbte die CI
# mitten in einem Release rot, obwohl der Code selbst unveraendert war.
#
# Zweiter Grund fuer einen eigenen Lauf: gitleaks-action scannt bei den
# Events `schedule`/`workflow_dispatch` den vollen Git-Verlauf (kein
# `--log-opts`, anders als beim `push`-Event in ci.yml, das nur den
# Push-Bereich prueft). Luecke und Gegenmassnahme: CLAUDE.md, Abschnitt
# Pruefschritte.
#
# Dritter Grund, seit diesem Commit: gitleaks laeuft hier in einem eigenen
# Job, damit weder Fehlschlag noch Abbruch der Audits den Scan verhindert.
name: Wochen-Pruefung

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abhaengigkeiten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        id: npm-ci
        if: ${{ !cancelled() }}
        working-directory: frontend
      # npm audit liest nur die Sperrdatei, nicht node_modules: nach einem
      # gescheiterten npm ci (Integritaet, postinstall, Platz) waere der
      # Baum nicht installiert, npm audit liefe trotzdem und meldete
      # faelschlich gruen. outcome == 'success' verhindert das; !cancelled()
      # bleibt aus demselben Grund wie bei pip-audit erhalten.
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        working-directory: frontend

  geheimnisse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
