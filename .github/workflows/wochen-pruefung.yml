# Getrennt vom Push-Pfad (ci.yml), weil beide Rot-Ursachen fachlich verschieden
# sind: Ein neu veroeffentlichtes fremdes Advisory (pip-audit/npm audit) faerbt
# diesen Lauf rot, OHNE dass sich im Repo etwas geaendert hat. Liefe das auf dem
# Push-Pfad, wuerde ein fremdes Advisory eine Auslieferung blockieren, die damit
# nichts zu tun hat — und das erzieht dazu, rote Laeufe wegzuklicken statt sie
# ernst zu nehmen.
# Beleg aus diesem Repo: Commit 096db40 — ein nanoid-Advisory faerbte die CI
# mitten in einem Release rot, obwohl der Code selbst unveraendert war.
name: Wochen-Pruefung

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abhaengigkeiten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
